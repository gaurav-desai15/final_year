[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpgvd"
version = "0.1.0"
description = "CPG-based, context-aware vulnerability detector: clones a repo, builds a Code Property Graph with Joern, and uses Claude to reason about vulnerabilities across call/data-flow context."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "anthropic>=0.40.0",
    "cpgqls-client>=0.0.9",
    "click>=8.1.7",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "GitPython>=3.1.42",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]

[project.scripts]
cpgvd = "cpgvd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
