[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cpgvd"
version = "0.1.0"
description = "CPG-based, context-aware vulnerability detector: clones a repo, builds a Code Property Graph with Joern, and uses Claude to reason about vulnerabilities across call/data-flow context."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "cpgqls-client>=0.0.9",
    "requests>=2.31.0",
    "click>=8.1.7",
    "pydantic>=2.6.0",
    "PyYAML>=6.0.1",
    "rich>=13.7.0",
    "GitPython>=3.1.42",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
# Installs anthropic too, so the full test suite (including AnthropicProvider)
# runs -- it's still never required at runtime unless --provider anthropic is used.
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "anthropic>=0.40.0",
    # So the web-console and dashboard tests run rather than skip.
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "streamlit>=1.38.0",
    "pandas>=2.0.0",
]
# Only needed if you opt into the paid Claude backend (--provider anthropic).
# The default (free, local Ollama) backend doesn't need this at all.
anthropic = [
    "anthropic>=0.40.0",
]
# Only needed for `cpgvd dashboard` (interactive report viewer).
dashboard = [
    "streamlit>=1.38.0",
    "pandas>=2.0.0",
]
# Only needed for `cpgvd web` (the single-page console). The frontend has no
# build step and no CDN dependencies -- this is just the HTTP server.
web = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
]

[project.scripts]
cpgvd = "cpgvd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cpgvd = ["web/static/*"]
